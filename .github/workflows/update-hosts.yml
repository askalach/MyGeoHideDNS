name: Update hosts

on:
  # 01:00 UTC — за полчаса до запуска DnsConf (01:30 UTC),
  # чтобы тот забирал уже свежий список.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Пропустить проверку на резкое сокращение списка'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate hosts
        run: python3 scripts/generate_hosts.py ${{ inputs.force && '--force' || '' }}

      - name: Commit if changed
        run: |
          # Дата сборки меняется каждый запуск, поэтому смотрим только на
          # содержательные строки — иначе коммит был бы ежедневным впустую.
          if git diff --quiet -- hosts/hosts; then
            echo "Изменений нет."
            exit 0
          fi
          if [ -z "$(git diff -U0 -- hosts/hosts | grep -E '^[+-][^+-]' | grep -vE '^[+-]# Дата сборки:')" ]; then
            echo "Поменялась только дата сборки — коммит не нужен."
            git checkout -- hosts/hosts
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hosts/hosts
          git commit -m 'update hosts'
          git push
